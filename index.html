<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="그냥 다 참는 거야">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>그냥 다 참는 거야</title>
</head>
<body>
  <header>
    <h1>그냥 다 참는 거야</h1>
    <p id="quote"></p>
  </header>

  <section id="rank">
    <div id="face"></div>
    <div class="rank-info">
      <div class="rank-title"><span id="badge"></span><b id="rank-name"></b></div>
      <div class="meta" id="rank-meta"></div>
      <progress id="rank-bar" max="100"></progress>
    </div>
  </section>

  <main id="list"></main>

  <dialog id="levelup">
    <div id="levelup-body"></div>
    <form method="dialog"><button>확인</button></form>
  </dialog>

  <form id="add">
    <input id="name" placeholder="새 항목 (예: 금연)" required maxlength="20">
    <input id="goal" type="number" min="7" required inputmode="numeric" placeholder="목표 일수 (필수, 최소 7일)">
    <input id="start" type="datetime-local">
    <button>추가</button>
  </form>

  <footer>
    <button id="export" class="link">내보내기</button>
    <label class="link">가져오기<input id="import" type="file" accept="application/json" hidden></label>
  </footer>

  <script src="rank.js"></script>
  <script src="avatar.js"></script>
  <script src="app.js"></script>
</body>
</html>
