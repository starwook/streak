<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="금욕">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>금욕 트래커</title>
</head>
<body>
  <header>
    <h1>금욕 트래커</h1>
    <p id="quote"></p>
  </header>

  <main id="list"></main>

  <form id="add">
    <input id="name" placeholder="새 항목 (예: 금연)" required maxlength="20">
    <input id="start" type="datetime-local">
    <button>추가</button>
  </form>

  <footer>
    <button id="export" class="link">내보내기</button>
    <label class="link">가져오기<input id="import" type="file" accept="application/json" hidden></label>
  </footer>

  <script src="app.js"></script>
</body>
</html>
